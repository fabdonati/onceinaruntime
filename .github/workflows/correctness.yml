name: Correctness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: debug
            strategy_example: 'OFF'
          - os: ubuntu-latest
            preset: sanitize
            strategy_example: 'OFF'
          - os: macos-latest
            preset: debug
            strategy_example: 'ON'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Python analysis dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-analysis.txt
      - name: GCC toolchain
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew list gcc >/dev/null 2>&1 || brew install gcc
            compiler_candidates=("$(brew --prefix gcc)"/bin/g++-[0-9]*)
            compiler_path="${compiler_candidates[0]}"
          else
            compiler_path=$(command -v g++)
          fi
          test -n "$compiler_path"
          "$compiler_path" --version
          echo "OIR_CI_COMPILER=$compiler_path" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER="$OIR_CI_COMPILER" -DOIR_STRATEGY_EXAMPLES=${{ matrix.strategy_example }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
